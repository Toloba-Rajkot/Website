<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toloba Rajkot - Coming Soon</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #002d13; /* Dark green theme */
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #43d17c; /* Light green for headings */
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        .countdown {
            font-size: 2rem;
            color: #e0fbe6;
        }

        .footer {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 0.9rem;
            color: #8fe1aa;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .container {
            animation: fadeIn 1s ease-in-out;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src ="Picture 1.png"/>
        <h1>Toloba Rajkot</h1>
        <p>We're working hard to bring you something amazing. Stay tuned!</p>
        <div class="countdown">Launching Soon...</div>
    </div>
    <div class="footer">© 2025 Toloba Rajkot. All rights reserved.</div>
</body>
</html>
